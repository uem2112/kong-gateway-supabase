_format_version: "3.0"
_transform: true

services:

  # ---------------------------
  # SUPABASE – PostgREST
  # ---------------------------
  - name: postgrest-service
    url: http://rest-sowwgwwc84coccwcwokwk8ss:3000
    routes:
      - name: postgrest-route
        paths:
          - /rest/v1
        strip_path: true
        preserve_host: false

  # ---------------------------
  # SUPABASE – Auth (GoTrue)
  # ---------------------------
  - name: gotrue-service
    url: http://auth-sowwgwwc84coccwcwokwk8ss:8081
    routes:
      - name: gotrue-route
        paths:
          - /auth/v1
        strip_path: true
        preserve_host: false

  # ---------------------------
  # SUPABASE – Storage
  # ---------------------------
  - name: storage-service
    url: http://storage-sowwgwwc84coccwcwokwk8ss:5000
    routes:
      - name: storage-route
        paths:
          - /storage/v1
        strip_path: false
        preserve_host: false

  # ---------------------------
  # KALTAKQUISE BACKEND
  # ---------------------------
  - name: kaltakquise-backend-service
    url: http://kaltakquise-backend:3350
    routes:
      - name: kaltakquise-backend-route
        paths:
          - /kaltakquise
        strip_path: true
        preserve_host: false

  # ---------------------------
  # SALES PIPELINE BACKEND
  # ---------------------------
  - name: sales-backend-service
    url: http://backend-mwscgwsgss0kcgo84o0s4ckw-022254664887:3300
    routes:
      - name: sales-backend-route
        paths:
          - /sales
        strip_path: true
        preserve_host: false


# ---------------------------
# GLOBAL CORS
# ---------------------------
plugins:
  - name: cors
    config:
      origins:
        - https://baucircle-beratung.de
        - https://app.baucircle-beratung.de
        - https://api.baucircle-beratung.de
        - https://kaltakquise.baucircle-beratung.de
        - https://crm.baucircle-beratung.de
        - https://sales-pipeline.baucircle-beratung.de
        - http://localhost:3000
        - http://localhost:5173
      credentials: true
      exposed_headers:
        - X-Auth-Token
        - Authorization
        - Content-Type
        - Content-Length
        - Content-Range
      headers:
        - Accept
        - Accept-Version
        - Authorization
        - Content-Length
        - Content-MD5
        - Content-Type
        - Date
        - X-Auth-Token
        - apikey
        - x-client-info
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      max_age: 3600
      preflight_continue: false
