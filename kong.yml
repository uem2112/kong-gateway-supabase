# ---------------------------
# Global CORS Plugin
# ---------------------------
plugins:
  - name: cors
    config:
      origins:
        - https://baucircle-beratung.de
        - https://app.baucircle-beratung.de
        - https://api.baucircle-beratung.de
        - https://crm.planex-group.de
        - http://localhost:3000
        - http://localhost:5173
      credentials: true
      exposed_headers:
        - X-Auth-Token
        - Authorization
        - Content-Type
        - Content-Length
        - Content-Range
      headers:
        - Accept
        - Accept-Version
        - Authorization
        - Content-Length
        - Content-MD5
        - Content-Type
        - Date
        - X-Auth-Token
        - apikey
        - x-client-info
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      max_age: 3600
      preflight_continue: false
